services:
  back-end:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    image: softy-pinko-back-end:task5
    # BURADA "ports:" OLMAMALIDIR! Əgər varsa, sil.
    expose:
      - "5252"

  front-end:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    image: softy-pinko-front-end:task5
    # BURADA DA "ports:" OLMAMALIDIR! Sil.
    expose:
      - "9000"

  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: softy-pinko-proxy:task5
    # YALNIZ PROXY-DƏ "ports" OLMALIDIR
    ports:
      - "80:80"
    depends_on:
      - back-end
      - front-end